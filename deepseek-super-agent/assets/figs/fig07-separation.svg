<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="610" viewBox="0 0 1140 610" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA7B4"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2052BB"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B6A"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0661F"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24A4A"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12314E"/></marker></defs><rect width="1140" height="610" fill="#FFFFFF"/><text x="570" y="44" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">存算分离：计算、状态、环境，两步解耦</text><text x="570" y="76" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">借鉴计算机系统的 Compute-Storage Separation；与 Anthropic 的“脑手分离”思路一致</text><rect x="60" y="110" width="1020" height="210" rx="18" fill="#E9EFFC" stroke="#2052BB" stroke-width="2" opacity="1"/><text x="140" y="145" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#2052BB" text-anchor="star