="#55687A" text-anchor="middle" font-weight="400" opacity="1">计算 ⇄ 状态</text><text x="950" y="244" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">分离</text><line x1="275" y1="322" x2="275" y2="360" stroke="#2052BB" stroke-width="2" marker-end="url(#arr-blue)"/><line x1="670" y1="322" x2="670" y2="360" stroke="#2052BB" stroke-width="2" marker-end="url(#arr-blue)"/><text x="570" y="350" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">指令下发 / 结果回传</text><text x="950" y="350" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#2052BB" text-anchor="middle" font-weight="700" opacity="1">第二步：计算 ⇄ 环境分离</text><rect x="90" y="380" width="300" height="130" rx="12" fill="#FFFFFF" stroke="#2E8B6A" stroke-width="1.8" opacity="1"/><text x="240" y="414" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#2E8B6A" text-anchor="middle" font-weight="700" opacity="1">个人开发机</text><text x="240" y="442" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">端侧轻量 daemon</text><text x="240" y="468" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">不存会话状态，只执行命令</text><text x="240" y="492" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">未提交改动 · 本地凭据</text><rect x="430" y="380" width="300" height="130" rx="12" fill="#FFFFFF" stroke="#2052BB" stroke-width="1.8" opacity="1"/><text x="580" y="414" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#2052BB" text-anchor="middle" font-weight="700" opacity="1">云端托管 / 按需环境</text><text x="580" y="442" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">端侧轻量 daemon</text><text x="580" y="468" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">不存会话状态，只执行命令</text><text x="580" y="492" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">弹性算力</text><rect x="770" y="380" width="300" height="130" rx="12" fill="#FFFFFF" stroke="#C0661F" stroke-width="1.8" opacity="1"/><text x="920" y="414" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#C0661F" text-anchor="middle" font-weight="700" opacity="1">间歇在线的设备</text><text x="920" y="442" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">端侧轻量 daemon</text><text x="920" y="468" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">不存会话状态，只执行命令</text><text x="920" y="492" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">上线后自动接着做</text><rect x="170" y="540" width="800" height="44" rx="22" fill="#E7F4EE" stroke="#2E8B6A" stroke-width="1.4" opacity="1"/><text x="570" y="568" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#2E8B6A" text-anchor="middle" font-weight="600" opacity="1">执行环境留在原地（BYOM）—— 内网服务、私人凭据不必搬上云；哪台机器开着就用哪台</text></svg>