PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">五大支撑模块</text><rect x="435" y="148" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" opacity="1"/><rect x="435" y="148" width="6" height="66" rx="3" fill="#2052BB" stroke="#2052BB" stroke-width="1.5" opacity="1"/><text x="465" y="176" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">② 双层架构</text><text x="465" y="200" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="start" font-weight="400" opacity="1">Router 承接交互与分派，Worker 隔离上下文并行执行</text><rect x="905" y="167" width="140" height="28" rx="14.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="975.0" y="185.375" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="500" opacity="1">支撑 连续 · 高效</text><rect x="435" y="230" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" opacity="1"/><rect x="435" y="230" width="6" height="66" rx="3" fill="#C0661F" stroke="#C0661F" stroke-width="1.5" opacity="1"/><text x="465" y="258" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">③ 事件驱动</text><text x="465" y="282" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="start" font-weight="400" opacity="1">Trigger 两级过滤、Thread 订阅直通、投机执行</text><rect x="905" y="249" width="140" height="28" rx="14.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="975.0" y="267.375" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="500" opacity="1">支撑 主动</text><rect x="435" y="312" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" opacity="1"/><rect x="435" y="312" width="6" height="66" rx="3" fill="#2E8B6A" stroke="#2E8B6A" stroke-width="1.5" opacity="1"/><text x="465" y="340" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">④ 面向人的交互</text><text x="465" y="364" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="start" font-weight="400" opacity="1">异步 ReAct Loop 全双工，多信道各按其带宽交付</text><rect x="905" y="331" width="140" height="28" rx="14.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="975.0" y="349.375" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="500" opacity="1">支撑 连续 · 高效</text><rect x="435" y="394" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" opacity="1"/><rect x="435" y="394" width="6" height="66" rx="3" fill="#2052BB" stroke="#2052BB" stroke-width="1.5" opacity="1"/><text x="465" y="422" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">⑤ 计算/状态/环境分离</text><text x="465" y="446" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="start" font-weight="400" opacity="1">Agent Loop 上云常驻，执行环境留在本地 daemon</text><rect x="905" y="413" width="140" height="28" rx="14.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="975.0" y="431.375" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="500" opacity="1">支撑 持久</text><rect x="435" y="476" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.4" opacity="1"/><rect x="435" y="476" width="6" height="66" rx="3" fill="#C24A4A" stroke="#C24A4A" stroke-width="1.5" opacity="1"/><text x="465" y="504" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17.5" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">⑥ Watchdog</text><text x="465" y="528" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="start" font-weight="400" opacity="1">系统外的独立控制回路，盯进展、防跑偏、能自愈</text><rect x="905" y="495" width="140" height="28" rx="14.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="975.0" y="513.375" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="500" opacity="1">支撑 持久</text><line x1="355" y1="330" x2="405" y2="330" stroke="#9AA7B4" stroke-width="2.5" marker-end="url(#arr-gray)"/></svg>