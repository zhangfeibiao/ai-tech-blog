<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="570" viewBox="0 0 1140 570" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA7B4"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2052BB"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B6A"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0661F"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24A4A"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12314E"/></marker></defs><rect width="1140" height="570" fill="#FFFFFF"/><text x="570" y="44" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">全双工：异步 ReAct Loop，后台干活、前台接话</text><rect x="40" y="80" width="1060" height="190" rx="14" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="120" y="116" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#C24A4A" text-anchor="start" font-weight="700" opacity="1">经典 ReAct Loop</text><rect x="70" y="140" width="130" height="34" rx="17.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="135.0" y="161.9" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">用户消息 1</text><line x1="202" y1="157" x2="240" y2="157" stroke="#9AA7B4" stroke-width="2" marker-end="url(#arr-gray)"/><rect x="245" y="140" width="170" height="34" rx="17.0" fill="#E9EFFC" stroke="#2052BB" stroke-width="1.5" opacity="1"/><text x="330.0" y="161.9" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2052BB" text-anchor="middle" font-weight="600" opacity="1">LLM 调用 run()</text><line x1="417" y1="157" x2="455" y2="157" stroke="#9AA7B4" stroke-width="2" marker-end="url(#arr-gray)"/><rect x="460" y="132" width="380" height="50" rx="8" fill="#FAEBEB" stroke="#C24A4A" stroke-width="1.5" stroke-dasharray="6 4" opacity="1"/><text x="650" y="163" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#C24A4A" text-anchor="middle" font-weight="600" opacity="1">同步阻塞：等工具返回（可能十几分钟）</text><line x1="842" y1="157" x2="880" y2="157" stroke="#9AA7B4" stroke-width="2" marker-end="url(#arr-gray)"/><rect x="885" y="140" width="150" height="34" rx="17.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="960.0" y="161.9" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#55687A" text-anchor="middle" font-weight="600" opacity="1">才能回下一句</text><text x="570" y="220" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">期间你说什么它都收不到，想叫停也只能等</text><text x="570" y="248" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#C24A4A" text-anchor="middle" font-weight="600" opacity="1">半双工</text><rect x="40" y="295" width="1060" height="250" rx="14" fill="#FFFFFF" stroke="#2E8B6A" stroke-width="1.8" opacity="1"/><text x="120" y="331" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#2E8B6A" text-anchor="start" font-weight="700" opacity="1">异步 ReAct Loop</text><rect x="60" y="355" width="128" height="36" rx="18.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="124.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">用户消息 1</text><line x1="191" y1="373" x2="210" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="213" y="355" width="128" height="36" rx="18.0" fill="#E7F4EE" stroke="#2E8B6A" stroke-width="1.5" opacity="1"/><text x="277.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2E8B6A" text-anchor="middle" font-weight="600" opacity="1">LLM 调用 start()</text><line x1="344" y1="373" x2="363" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="366" y="355" width="128" height="36" rx="18.0" fill="#E7F4EE" stroke="#2E8B6A" stroke-width="1.5" opacity="1"/><text x="430.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2E8B6A" text-anchor="middle" font-weight="600" opacity="1">立即返回“已启动”</text><line x1="497" y1="373" x2="516" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="519" y="355" width="128" height="36" rx="18.0" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="583.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#12314E" text-anchor="middle" font-weight="600" opacity="1">用户消息 2（插话）</text><line x1="650" y1="373" x2="669" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="672" y="355" width="128" height="36" rx="18.0" fill="#E7F4EE" stroke="#2E8B6A" stroke-width="1.5" opacity="1"/><text x="736.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2E8B6A" text-anchor="middle" font-weight="600" opacity="1">LLM 即时回复</text><line x1="803" y1="373" x2="822" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="825" y="355" width="150" height="36" rx="18.0" fill="#E9EFFC" stroke="#2052BB" stroke-width="1.5" opacity="1"/><text x="900.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2052BB" text-anchor="middle" font-weight="600" opacity="1">结果作为新消息投递</text><line x1="978" y1="373" x2="997" y2="373" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><rect x="1000" y="355" width="128" height="36" rx="18.0" fill="#12314E" stroke="#12314E" stroke-width="1.5" opacity="1"/><text x="1064.0" y="377.55" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" opacity="1">交付任务结果</text><rect x="150" y="430" width="700" height="56" rx="10" fill="#F6F8FA" stroke="#2E8B6A" stroke-width="1.5" stroke-dasharray="7 5" opacity="1"/><text x="500" y="464" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#2E8B6A" text-anchor="middle" font-weight="600" opacity="1">后台异步执行耗时工具（跑测试 / 派活给 Worker）</text><path d="M310,392 L310,424" fill="none" stroke="#2E8B6A" stroke-width="2" marker-end="url(#arr-green)"/><path d="M815,430 L960,430 L960,397" fill="none" stroke="#2052BB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/><text x="500" y="518" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">随时可以补充、插话，也可以调用 stop() 把跑偏的任务停掉</text></svg>