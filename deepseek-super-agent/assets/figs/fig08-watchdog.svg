acity="1">Watchdog</text><text x="180" y="206" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">独立 Agent Session</text><text x="180" y="236" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">定时消息驱动</text><text x="180" y="260" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">具备完整工具能力</text><text x="180" y="292" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">可用自然语言询问故障</text><text x="180" y="316" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">可在线修正主系统行为</text><text x="180" y="356" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#C24A4A" text-anchor="middle" font-weight="600" opacity="1">外部 Control Loop</text><rect x="400" y="110" width="660" height="330" rx="16" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.6" opacity="1"/><text x="730" y="145" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">主系统（Router + Workers）</text><rect x="430" y="170" width="600" height="64" rx="10" fill="#F6F8FA" stroke="#9AA7B4" stroke-width="1.2" opacity="1"/><text x="470" y="197" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#12314E" text-anchor="start" font-weight="700" opacity="1">Worker A</text><text x="470" y="219" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="start" f