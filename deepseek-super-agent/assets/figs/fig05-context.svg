<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="575" viewBox="0 0 1140 575" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA7B4"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2052BB"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B6A"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0661F"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24A4A"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12314E"/></marker></defs><rect width="1140" height="575" fill="#FFFFFF"/><text x="570" y="44" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">上下文组织：把上下文窗口当 Cache 管理</text><text x="570" y="76" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">浪费上下文窗口，就是浪费模型的智能</text><rect x="40" y="105" width="520" height="200" rx="14" fill="#FFFFFF" stroke="#9AA7B4" stroke-width="1.5" opacity="1"/><text x="300" y="140" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">Inline &amp; Spill（借鉴编译与体系结构）</text><rect x="70" y="165" width="210" height="110" rx="10" fill="#E9EFFC" stroke="#2052BB" stroke-width="1.6" opacity="1"/><text x="175" y="196" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#2052BB" text-anchor="middle" font-weight="700" opacity="1">Inline</text><text x="175" y="224" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">近期可能要用的信息</text><text x="175" y="246" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">直接内联进上下文</text><rect x="320" y="165" width="210" height="110" rx="10" fill="#FBF0E1" stroke="#C0661F" stroke-width="1.6" opacity="1"/><text x="425" y="196" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#C0661F" text-anchor="middle" font-weight="700" opacity="1">Spill</text><text x="425" y="224" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">超长 / 低频信息留在窗外</text><text x="425" y="246" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">只留引用与摘要，按需续读</text><line x1="282" y1="220" x2="315" y2="220" stroke="#9AA7B4" stroke-width="2" marker-end="url(#arr-gray)"/><text x="570" y="350" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">链式召回（Chain of Recall）：顺着引用图按需取回</text><rect x="55" y="385" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#2052BB" stroke-width="1.8" opacity="1"/><text x="170" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#2052BB" text-anchor="middle" font-weight="700" opacity="1">Trigger #42</text><text x="170" y="446" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">前 50 字 + 相邻消息</text><text x="170" y="470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">内含 thread_id</text><line x1="287" y1="445" x2="325" y2="445" stroke="#9AA7B4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-gray)"/><rect x="330" y="385" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#2E8B6A" stroke-width="1.8" opacity="1"/><text x="445" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#2E8B6A" text-anchor="middle" font-weight="700" opacity="1">Thread #08</text><text x="445" y="446" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">近期事件摘要</text><text x="445" y="470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">内含 trigger / worker 的 ID</text><line x1="562" y1="445" x2="600" y2="445" stroke="#9AA7B4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-gray)"/><rect x="605" y="385" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#C0661F" stroke-width="1.8" opacity="1"/><text x="720" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#C0661F" text-anchor="middle" font-weight="700" opacity="1">Worker #03</text><text x="720" y="446" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">任务进度与状态摘要</text><text x="720" y="470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">内含关联 thread_id</text><line x1="837" y1="445" x2="875" y2="445" stroke="#9AA7B4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-gray)"/><rect x="880" y="385" width="230" height="120" rx="12" fill="#FFFFFF" stroke="#12314E" stroke-width="1.8" opacity="1"/><text x="995" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16.5" fill="#12314E" text-anchor="middle" font-weight="700" opacity="1">Thread #15</text><text x="995" y="446" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">关联的 PR 讨论</text><text x="995" y="470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">继续按需展开…</text><text x="570" y="545" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" fill="#55687A" text-anchor="middle" font-weight="400" opacity="1">每个对象有唯一 ID，注入时内联关联对象的 ID —— 模型从当前事件出发，多跳找回全部上下文</text></svg>